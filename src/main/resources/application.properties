spring.application.name=psicologo-app
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/acolher_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

spring.jackson.default-property-inclusion=non_null

server.error.include-message=never
server.error.include-stacktrace=never

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiracao=PT1H
app.jwt.emissor=psicologo-app

app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:5173,http://localhost:8081,http://localhost:19006,http://127.0.0.1:8081,http://localhost:8080}

app.verificacao.validade=PT24H
app.verificacao.rota-frontend=/verificar-email

app.email.modo=${APP_EMAIL_MODO:log}
app.email.remetente=${MAIL_FROM:nao-responda@acolher.app}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# Importa configuracoes locais se presentes (ignorado pelo git)
spring.config.import=optional:classpath:application-local.properties
